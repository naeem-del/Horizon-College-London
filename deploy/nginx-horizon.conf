# Nginx in front of the Node app on a VPS (the app runs under PM2 on port 3000).
# Install: sudo cp deploy/nginx-horizon.conf /etc/nginx/sites-available/horizon
#          sudo ln -s /etc/nginx/sites-available/horizon /etc/nginx/sites-enabled/horizon
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d horizoncollegelondon.com -d www.horizoncollegelondon.com
#          (certbot adds the port 443 block and the http -> https redirect to this file)
server {
    listen 80;
    listen [::]:80;
    server_name horizoncollegelondon.com www.horizoncollegelondon.com;

    # Uploads go straight from the browser to Supabase Storage, so requests to this server stay small
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts one proxy (server.js: trust proxy 1) and uses these to know the visitor is on https,
        # which secure login cookies depend on
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
